name: Deploy to Remote Server

on:
  push:
    paths:
      - 'deg/uz_load_calculator/**'  # Укажите вашу папку

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.admin_fin-amzng }}
    
    - name: Deploy files via rsync
      run: |
        rsync -avz --delete \
          -e "ssh -o StrictHostKeyChecking=no" \
          deg/uz_load_calculator/ \
          ${{ secrets.REMOTE_USER_FIN_AMZNG }}@${{ secrets.REMOTE_HOST_FIN_AMZNG }}:/home/admin/nginx/deg
